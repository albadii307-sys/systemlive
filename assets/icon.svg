<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="نظامي">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1728"/>
      <stop offset="1" stop-color="#07101d"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#48f0c5"/>
      <stop offset="1" stop-color="#1b9f83"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="400" cy="104" r="150" fill="#6c8cff" opacity="0.12"/>
  <circle cx="106" cy="418" r="166" fill="#35e0b5" opacity="0.10"/>
  <rect x="112" y="112" width="288" height="288" rx="84" fill="url(#mark)" filter="url(#glow)"/>
  <text x="256" y="325" text-anchor="middle" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif" font-size="216" font-weight="700" fill="#05201a">ن</text>
</svg>
